# PostgreSQL Configuration for Debezium CDC
# This enables logical replication required for change data capture

# ============================================================================
# REPLICATION SETTINGS
# ============================================================================

# Enable logical replication
wal_level = logical

# Maximum number of replication slots
max_replication_slots = 4

# Maximum number of WAL sender processes
max_wal_senders = 4

# Minimum WAL segments to retain
wal_keep_size = 512MB

# ============================================================================
# CONNECTION SETTINGS
# ============================================================================

# Allow connections from Docker network
listen_addresses = '*'

# Maximum connections
max_connections = 100

# ============================================================================
# LOGGING
# ============================================================================

# Log all statements (useful for debugging)
log_statement = 'mod'  # Log data modification statements

# Log connections
log_connections = on

# Log disconnections  
log_disconnections = on

# Log line prefix
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '

# ============================================================================
# PERFORMANCE
# ============================================================================

# Shared buffers
shared_buffers = 256MB

# Effective cache size
effective_cache_size = 1GB

# Work memory
work_mem = 16MB

# Maintenance work memory
maintenance_work_mem = 128MB
